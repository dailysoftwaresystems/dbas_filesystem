name: dbas_filesystem
description: "Flutter plugin for cross-platform file system operations with streaming, byte array, and directory support across Android, iOS, macOS, Linux, Windows, and Web (OPFS)."
version: 3.1.3
homepage: https://github.com/dailysoftwaresystems/dbas_filesystem
repository: https://github.com/dailysoftwaresystems/dbas_filesystem
issue_tracker: https://github.com/dailysoftwaresystems/dbas_filesystem/issues
author_name: Daily Software Systems
author_email: dailysoftwaresystems@dailysoftwaresystems.com

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1
  path: ^1.9.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      web:
        pluginClass: DbasFileSystemNativeWeb
        fileName: src/native/dbas_filesystem_native_web.dart
  assets:
    - web/libs/dbas_filesystem_worker.js
