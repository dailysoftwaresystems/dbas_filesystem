name: dbas_filesystem_example
description: "Demonstrates how to use the dbas_filesystem plugin."
publish_to: 'none'

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  dbas_filesystem:
    path: ../
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
